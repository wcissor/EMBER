/* ==========================================================================
   4. COMPONENTS
   ========================================================================== */
/* Buttons */
.btn { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--control-h); padding: 7px 16px; border-radius: var(--r-control); border: 1px solid transparent; font-size: 16px; line-height: 22px; font-weight: 500; text-align: center; transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
.btn:hover { text-decoration: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); border-color: var(--ink); }

.btn-ghost:hover:not(:disabled) { background: var(--subtle); }
.btn-muted { color: var(--muted); }

.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; }
.btn-sm { min-height: var(--control-h-sm); padding: 5px 12px; font-size: 15px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.why { font-size: 14px; line-height: 20px; color: var(--muted); }
.link { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-weight: 500; }
.link-btn { color: var(--primary); font-weight: 500; min-height: var(--target); display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
/* Fields */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field .label, .legend { font-size: 15px; line-height: 22px; color: var(--muted); }
.input, .select, .textarea { width: 100%; min-height: var(--control-h); padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); color: var(--ink); font-size: 16px; line-height: 24px; }
.textarea { min-height: 88px; resize: vertical; }
.select { appearance: none; -webkit-appearance: none; padding-right: 40px; background-image: none; }
.select-wrap { position: relative; display: block; min-width: 0; }
.select-wrap > svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink); }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: 1; }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border: 2px solid var(--critical); padding: 6px 11px; }
.help { font-size: 14px; line-height: 20px; color: var(--muted); }

.err::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; transform: translateY(-2px); }
.search { position: relative; min-width: 0; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 42px; }
.check, .radio { display: inline-flex; align-items: flex-start; gap: 10px; min-height: var(--target); cursor: pointer; font-size: 16px; line-height: 24px; }
.check input, .radio input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary); flex: none; cursor: pointer; }
.check input:disabled + span, .radio input:disabled + span { color: var(--muted); }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.choice-col { display: flex; flex-direction: column; gap: 8px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--line-strong); flex: none; transition: background var(--t-fast) var(--ease); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform var(--t-med) var(--ease); }

.switch:disabled { opacity: .45; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--surface-2); }
.seg button, .seg a { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 12px; border-radius: 6px; border: 1px solid transparent; color: var(--ink); font-size: 16px; line-height: 22px; }
.seg button:hover, .seg a:hover { background: var(--subtle); text-decoration: none; }
.seg [aria-checked="true"], .seg [aria-pressed="true"], .seg [aria-current="true"] { background: var(--surface); border-color: var(--line-strong); }
.seg .n { color: var(--muted); font-size: 14px; }
/* Status and tags */
.status { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
.dot.ok { background: var(--primary); } .dot.warn { background: var(--amber-icon); } .dot.off { background: var(--offline); }

.tag.primary { background: var(--primary-tint); color: var(--primary); }

.id { font-family: var(--mono); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.muted { color: var(--muted); }
.amber-text { color: var(--amber-text); }
.crit-text { color: var(--critical); }
.ok-text { color: var(--primary); }
/* Panels, lists */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.panel-head.plain { border-bottom: 0; padding-bottom: 8px; }
.panel-body { padding: 20px 24px; }

.section-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 16px; }
.section-head h2 { display: inline-flex; align-items: center; gap: 12px; }
.list > li + li, .list > .li + .li { border-top: 1px solid var(--line); }
.row-item { display: flex; align-items: center; gap: 12px; min-height: var(--row-h); padding: 14px 24px; }
.row-item .dot { margin-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; line-height: 24px; }

/* Hash router: #/path/segments?query */
const router = {
  routes: [],
  cur: null,
  add(pattern, screen, opts = {}) { this.routes.push({ pattern, parts: pattern.split('/').filter(Boolean), screen, opts }); },
  parse(hash = location.hash) {
    const raw = hash.replace(/^#/, '') || '/overview';
    const [path, qs = ''] = raw.split('?');
    return { path: path.replace(/\/+$/, '') || '/overview', query: new URLSearchParams(qs) };
  },
  match(path) {
    const parts = path.split('/').filter(Boolean);
    for (const r of this.routes) {
      if (r.parts.length !== parts.length) continue;
      const params = {}; let ok = true;
      r.parts.forEach((p, i) => { if (p.startsWith(':')) params[p.slice(1)] = decodeURIComponent(parts[i]); else if (p !== parts[i]) ok = false; });
      if (ok) return { route: r, params };

  },

  /** Update the query without re-rendering (filters, sort, views live in the URL). */
  setQuery(obj) {

};

  const slotT = (n, ch, k) => START + n.phase[ch] + k * n.I;

  let backfillCut = SC.uplink.to;

async function boot() {
  app.el = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  i18n.debug = params.has('debug');
  // Debug mode only: expose modules for the QA harness (no secrets or personal data live in them).
  if (i18n.debug) Object.assign(window, { api, mockServer, store, realtime, dataGen, clock, LEGAL, sha256Hex, app, prefs });
  buildPseudo();
  const db = mockServer.load();
  clock.init(db.clock);
  if (db.terms30) LEGAL.docs.tos.versions['3.0'] = db.terms30.effective;
  prefs.load('anon');
  const pLang = params.get('lang');
  const nav = (navigator.language || 'az').slice(0, 2);
  i18n.lang = pLang && DICT[pLang] ? pLang : prefs.get('lang') || (i18n.langs.includes(nav) ? nav : 'az');
  document.documentElement.lang = i18n.lang === 'xx' ? 'en-XA' : i18n.lang;
  theme.init(); app.applyPrefs();
  dataGen.init();
  await mockServer.seedLedger();
  store.set('online', navigator.onLine);
  if (mockServer.session()) {
    try {
      const me = await app.loadMe();
      if (!(pLang && DICT[pLang]) && prefs.get('lang')) i18n.lang = prefs.get('lang');
      document.documentElement.lang = i18n.lang === 'xx' ? 'en-XA' : i18n.lang;
      app.applyPrefs(); app.blocked = app.materialBlock(me);
      realtime.start();
    } catch (e) { store.set('me', null); }
  }
  router.add('/signin', screens.signin, { public: true, bare: true });
  router.add('/consent', screens.consent, { bare: true });
  router.add('/overview', screens.overview);
  router.add('/map', screens.map);
  router.add('/nodes', screens.nodes);
  router.add('/nodes/:id', screens.node);
  router.add('/gateways', screens.gateways);
  router.add('/gateways/:id', screens.gateway);
  router.add('/alerts', screens.alerts);
  router.add('/forecast', screens.forecast);
  router.add('/data', screens.data);
  router.add('/activity', screens.activity, { perm: 'audit' });
  router.add('/settings', () => { router.go('/settings/general'); return h('div'); });
  router.add('/settings/:section', screens.settings);
  router.add('/legal', screens.legal);
  router.add('/legal/:doc', screens.legalDoc);
  router.add('/help', screens.help);
  window.addEventListener('hashchange', () => { app.focusOnRender = true; app.render(); });
  store.on('live', () => app.updateLive());
  store.on('lastUpdate', () => app.updateLive());
  store.on('queue', () => app.renderBanners());
  store.on('prefs', () => app.applyPrefs());
  const setOnline = () => { const was = store.get('online'); store.set('online', navigator.onLine && mockServer.debug.net !== 'offline'); app.renderBanners(); if (!was && store.get('online')) { api.flush(); realtime.resume(); } if (!store.get('online')) realtime.drop(); };
  window.addEventListener('online', setOnline); window.addEventListener('offline', setOnline);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ui.layers.length && !(document.activeElement && document.activeElement.closest('.overlay'))) { const top = ui.layers[ui.layers.length - 1]; if (!top.blocking) { e.preventDefault(); top.close('esc'); return; } }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); debugPanel.open(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { if (store.get('me')) { e.preventDefault(); palette.open(); } }
    else if (e.key === '/' && !typing && store.get('me') && !document.querySelector('.overlay')) { e.preventDefault(); palette.open(); }
  });
  setInterval(() => {
    document.querySelectorAll('[data-countdown]').forEach((el) => { const left = +el.dataset.countdown - clock.now(); el.textContent = fmt.countdown(left); if (left <= 0) { app.loadMe().then(() => app.renderBanners()).catch(() => {}); } });
  }, 1000);
  setInterval(() => { document.querySelectorAll('[data-fresh]').forEach((el) => ui.updateFresh(el)); app.updateLive(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (!realtime.userPaused && store.get('me')) { realtime.hiddenPause = true; realtime.pause(); realtime.userPaused = false; } } else if (realtime.hiddenPause) { realtime.hiddenPause = false; realtime.resume(); } });
  let sr = 0;
  const markScrollables = () => { sr = 0; document.querySelectorAll('.tbl-wrap, .vt-scroll').forEach((el) => { const scrolls = el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1; if (scrolls) { el.tabIndex = 0; el.setAttribute('role', 'region'); if (!el.hasAttribute('aria-label')) { const cap = el.querySelector('caption') || el.closest('section')?.querySelector('h2,h3'); el.setAttribute('aria-label', (cap ? cap.textContent : t('nt.grid')).trim()); } } else if (el.classList.contains('tbl-wrap')) { el.removeAttribute('tabindex'); el.removeAttribute('role'); } }); };
  new MutationObserver(() => { if (!sr) sr = requestAnimationFrame(markScrollables); }).observe(app.el, { childList: true, subtree: true });
  window.addEventListener('resize', () => { if (!sr) sr = requestAnimationFrame(markScrollables); });
  app.render();
  // Pre-compute remaining 5-min rollups in small idle chunks (each well under 50 ms).
  const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 200));
  idle(() => dataGen.warm(dataGen.nodes, dataGen.START, clock.now(), clock.now()));
}

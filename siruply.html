<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Siruply</title>
<style>
/* ===========================================================================
   TOKENS
   Single source of colour and type. Values taken from /design/Siruply Tokens.
   Seven named colours, three radii, a 4px spacing base, a 16px type floor.

   CONTRAST, computed (WCAG 2.1 relative luminance), matching the design's
   stated table. Body text is at 7:1 or better everywhere:

     ink   #111111 on paper #FFFFFF  — body, values, labels ........ 18.88:1
     ink   #111111 on shelf #EEEBE5  — annotation text ............. 15.94:1
     focus #1F2E63 on paper #FFFFFF  — active field, actions ....... 12.86:1
     paper #FFFFFF on focus #1F2E63  — completion button label ..... 12.86:1
     alert #8E1420 on paper #FFFFFF  — look-alike ingredient ....... 9.31:1
     alert #8E1420 on shelf #EEEBE5  — look-alike annotation ....... 7.86:1
     open  #7A4A00 on paper #FFFFFF  — open-decision label ......... 7.52:1
     open  #7A4A00 on shelf #EEEBE5  — NON-TEXT only ................ 6.29:1  (*)
     line  #8F887E on paper #FFFFFF  — structural rules, NON-TEXT ... 3.53:1

   (*) `open` on `shelf` is the one pair under 7:1, so no text is ever set in
   it. It appears only as the 6px rail and the glyph-badge border, both
   non-text, where 3:1 is the applicable threshold. Open-decision TEXT always
   sits on paper (7.52:1) inside a field row, or in ink on the shelf-coloured
   completion bar. Every ratio above is asserted by the contrast gate, which
   walks the rendered DOM rather than trusting this table.

   No white text is ever set over a photograph. The evidence strip keeps its
   labels on solid ground beside the crop, never on it.
   =========================================================================== */
:root{
  --ink:#111111;
  --paper:#FFFFFF;
  --shelf:#EEEBE5;
  --line:#8F887E;
  --focus:#1F2E63;
  --open:#7A4A00;
  --alert:#8E1420;
  --photo-ground:#D9D2C2;

  --s4:4px;  --s8:8px;  --s12:12px; --s16:16px;
  --s24:24px; --s32:32px; --s48:48px;

  /* Three radii, all small. This sits next to a cash register. */
  --r-rail:0;
  --r-control:3px;
  --r-chip:8px;

  /* Targets: 56px resolves a field or completes a record, 44px everything else. */
  --t-resolve:56px;
  --t-nav:44px;

  /* Typeface stack.
     The design specifies IBM Plex Sans/Mono, which are webfonts. This file
     makes no external request of any kind, so the stack below is a system
     stack chosen for full Azerbaijani Latin (ə ğ ı İ ö ş ü ç) AND Cyrillic
     coverage in a SINGLE face on every target platform — so a field value
     mixing Latin, Cyrillic and a Latin drug name never jumps mid-line.
       Windows  : Segoe UI / Consolas      — both cover AZ Latin + Cyrillic
       macOS/iOS: SF / Menlo               — both cover AZ Latin + Cyrillic
       Android  : Roboto / Roboto Mono     — both cover AZ Latin + Cyrillic
       Linux    : DejaVu Sans / DejaVu Sans Mono — both cover
     Every mono face listed disambiguates 1/7, 0/O and 5/S; `slashed-zero`
     is requested on top wherever the face supports it. Dosage errors start
     in typography, so every digit in the product is set in the mono face
     with tabular figures. */
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
          "Helvetica Neue", "DejaVu Sans", "Noto Sans", Arial, sans-serif;
  --mono: Consolas, Menlo, "Roboto Mono", "DejaVu Sans Mono",
          "Liberation Mono", "Courier New", monospace;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }
body{
  background:var(--shelf);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;              /* 16px floor. There is no caption tier below it. */
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;   /* no 300ms delay */
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

/* Every digit in the product: mono, tabular, slashed zero where available. */
.num,.mono{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums slashed-zero;
  font-feature-settings:"tnum" 1,"zero" 1;
}

button{
  font:inherit; color:inherit; margin:0;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:var(--r-control);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
}
input{ font:inherit; color:inherit; }

[hidden]{ display:none!important; }
.vh{
  position:absolute!important; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; padding:0; margin:-1px;
}

/* ---------------------------------------------------------------- shell --
   The app owns the viewport height exactly once, at the root. Everything
   below is a flex child with `min-height:0`, so the column that scrolls is
   the field list — never the page. If the page itself scrolled, the pinned
   evidence strip and the completion bar in the bottom third would scroll
   away with it, which is the whole layout. */
#app{
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.screen{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:var(--shelf);
  max-width:760px;
  width:100%;
  margin:0 auto;
}

/* status bar — a prop, so the frames and the build line up in screenshots */
.statusbar{
  flex:none;
  display:flex; align-items:center; justify-content:space-between;
  padding:6px var(--s16) 2px;
  font-family:var(--mono); font-size:16px; font-weight:600;
  font-variant-numeric:tabular-nums slashed-zero;
  background:var(--shelf);
}

.topbar{
  flex:none;
  display:flex; align-items:center; gap:var(--s12);
  padding:var(--s12) var(--s16);
  background:var(--shelf);
  border-bottom:2px solid var(--ink);
}
.topbar .grow{ flex:1; min-width:0; }
.rec-no{ font-family:var(--mono); font-size:19px; font-weight:700; font-variant-numeric:tabular-nums slashed-zero; }
.rec-branch{ font-size:16px; }

.iconbtn{
  width:var(--t-nav); height:var(--t-nav); flex:none;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:19px; font-weight:700; line-height:1;
}
.iconbtn.wide{ width:auto; min-width:var(--t-nav); padding:0 13px; gap:7px; }
.iconbtn.on{ background:var(--ink); color:var(--paper); }

/* user chip — filled square for the current user, outlined for everyone else */
.chip{
  display:flex; align-items:center; gap:var(--s8);
  min-height:var(--t-nav); padding:0 10px;
  border:2px solid var(--ink); border-radius:var(--r-chip);
  background:var(--paper);
}
.sq{
  width:32px; height:32px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:16px; font-weight:700; line-height:1;
  border:2px solid var(--ink); border-radius:var(--r-chip);
  background:var(--paper); color:var(--ink);
}
.sq.cur{ background:var(--ink); color:var(--paper); }

/* ------------------------------------------------------- evidence strip -- */
.strip{
  flex:none;
  background:var(--shelf);
  border-bottom:2px solid var(--ink);
  padding:var(--s12);
  display:flex; flex-direction:column; gap:10px;
}
.crop{
  position:relative; width:100%;
  /* 164px is the design's height and what a 390x844 phone gets. On a short
     screen the strip is flex:none and the completion bar can be tall, so a
     fixed crop would squeeze the field column to nothing and push rows under
     the bar. Tying the crop to the viewport keeps the strip a bounded share
     of the screen; the tablet rule below overrides it to fill the pane. */
  height:clamp(110px, 20vh, 164px);
  overflow:hidden;
  background:var(--photo-ground);
  border:2px solid var(--line);
  cursor:zoom-in;
  contain:layout paint;       /* the crop can never reflow the field column */
}
.crop img{
  position:absolute; top:0; left:0;
  width:700px; height:900px;
  transform-origin:0 0;
  will-change:transform;
  transition:transform 260ms cubic-bezier(.22,.61,.36,1), filter 160ms linear;
}
.crop .outline.dim{
  border:2px dashed var(--line);
  box-shadow:none;
}
.crop .outline{
  position:absolute;
  border:2.5px solid var(--focus);
  box-shadow:0 0 0 2px rgba(255,255,255,.85);   /* halo: visible over ink and bright paper */
  pointer-events:none;
  transition:left 260ms cubic-bezier(.22,.61,.36,1), top 260ms cubic-bezier(.22,.61,.36,1),
             width 260ms cubic-bezier(.22,.61,.36,1), height 260ms cubic-bezier(.22,.61,.36,1);
}
.striprow{ display:flex; align-items:center; gap:10px; }
.striprow .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.strip-label{ font-size:16px; line-height:19px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.strip-index{ font-family:var(--mono); font-size:16px; line-height:19px; font-variant-numeric:tabular-nums slashed-zero; }

@media (prefers-reduced-motion:reduce){
  .crop img,.crop .outline{ transition:none; }
}

/* --------------------------------------------------------- field column -- */
.verify-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.fields{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:var(--s16);
  display:flex; flex-direction:column; gap:var(--s12);
  background:var(--shelf);
}
.row{
  display:flex;
  background:var(--paper);
  border:2px solid var(--line);
  scroll-margin-top:var(--s12);
}
.row.is-lookalike{ border-color:var(--alert); }
.rail{ width:6px; flex:none; background:var(--ink); }
.rail.open{ background:var(--open); }
.rail.alert{ background:var(--alert); }
/* Hollow rail: one reading in hand, the second outstanding. An outline reads
   as an unfilled container, which is exactly the claim. No shimmer anywhere. */
.rail.hollow{ background:var(--paper); border-left:2px solid var(--line); border-right:2px solid var(--line); }
.rail.dashed{ background:transparent; border-left:6px dashed var(--open); }

.rowbody{
  flex:1; min-width:0;
  padding:14px var(--s16) var(--s16);
  display:flex; flex-direction:column; gap:var(--s12);
}
.row[data-state="agreed"] .rowbody,
.row[data-state="awaiting"] .rowbody{ gap:10px; }
.row[data-state="settled"] .rowbody{ padding:14px var(--s16); gap:var(--s8); }
.rowhead{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s12); }
.flabel{ font-size:16px; font-weight:600; }
/* Focus moves to the field heading on every focus change, including taps.
   :focus-visible keeps the ring for keyboard users and off the glass. */
.flabel:focus{ outline:none; }
.flabel:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }

/* glyph badge — no two states share a glyph */
.badge{
  width:30px; height:30px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:18px; font-weight:700; line-height:1;
  border:2px solid var(--ink); color:var(--ink); background:var(--paper);
}
.badge.open{ border-color:var(--open); color:var(--open); }
.badge.alert{ border-color:var(--alert); color:var(--alert); }
.badge.dashed{ border-style:dashed; border-color:var(--open); color:var(--open); }
.badge.filled{ background:var(--ink); color:var(--paper); }
.badge.await{ border-color:var(--line); color:var(--ink); font-size:20px; }
.badge.g-swap{ font-size:17px; }   /* the disagreement glyph sits smaller */
.badge.g-tilde{ font-size:19px; }  /* the illegible glyph sits larger */

.fvalue{ font-size:20px; line-height:26px; font-weight:600; }
.fvalue.name{ font-size:28px; line-height:32px; font-weight:700; letter-spacing:-.005em; }
.fvalue.num{
  font-family:var(--mono); font-size:23px; line-height:28px; font-weight:600;
  font-variant-numeric:tabular-nums slashed-zero;
}
.fstate{ font-size:17px; line-height:22px; font-weight:600; }
.fstate.open{ color:var(--open); }
.fstate.alert{ color:var(--alert); }
.fnote{ font-size:16px; line-height:20px; }
.fawait{ font-size:16px; line-height:21px; padding-top:2px; border-top:2px solid var(--line); }

/* Options and actions: identical border, fill, height and type. */
.opts{ display:flex; flex-direction:column; gap:var(--s8); }
.opt{
  min-height:var(--t-resolve);
  width:100%;
  border:2px solid var(--ink); background:var(--paper);
  border-radius:var(--r-control);
  padding:11px 14px;
  display:flex; align-items:center; gap:10px;
  text-align:left;
}
.opt:hover{ background:var(--shelf); }
.opt .optv{ font-size:17px; line-height:26px; font-weight:600; }
.opt .optv.num{
  font-family:var(--mono); font-size:20px; line-height:26px; font-weight:600;
  font-variant-numeric:tabular-nums slashed-zero;
}
.pair{ display:flex; gap:10px; }
.pair .act{ flex:1; min-width:0; }
.act{
  min-height:var(--t-resolve);
  border:2px solid var(--ink); background:var(--paper);
  border-radius:var(--r-control);
  padding:8px 10px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  text-align:center;
}
.act:hover{ background:var(--shelf); }
.act .lbl{ font-size:17px; line-height:21px; font-weight:600; }
.act .gl{ font-family:var(--mono); font-size:18px; font-weight:700; line-height:1; }
.act.primary{ border-color:var(--focus); }
.act.primary:hover{ background:var(--focus); color:var(--paper); }
.stack{ display:flex; flex-direction:column; gap:10px; }
/* 24px is the minimum gap between anything confirmable and anything that
   discards work — the one spacing value with a safety reason behind it. */
.stack.safety{ gap:var(--s24); }

.orderrule{ font-size:16px; line-height:21px; padding-top:2px; }

/* absent: struck empty slot — the literal claim being confirmed */
.slot{
  height:34px; border:2px dashed var(--line); background:var(--shelf);
  display:flex; align-items:center; padding:0 var(--s12);
}
.slot i{ display:block; height:2px; width:100%; background:var(--line); }

/* catalogue annotation: indented past the value's left edge, on shelf, body
   size and weight, below the value. An annotation can never look like a value. */
.note{
  margin-left:18px;
  border-left:2px solid var(--line);
  background:var(--shelf);
  padding:11px 13px;
  display:flex; gap:10px;
}
.note.alert{ border-left-color:var(--alert); flex-direction:column; padding:12px 13px; }
.note .gl{ font-family:var(--mono); font-size:17px; font-weight:700; line-height:22px; flex:none; }
.note .body{ font-size:16px; line-height:22px; min-width:0; }
.note .body b{ font-weight:600; }
.note-title{ display:flex; gap:10px; align-items:baseline; }
.note-title .t{ font-size:16px; line-height:20px; font-weight:600; color:var(--alert); min-width:0; }
.cmp{ display:flex; flex-direction:column; gap:var(--s8); }
.cmpbox{
  display:flex; flex-direction:column; gap:1px;
  padding:var(--s8) 10px; background:var(--paper); border:2px solid var(--line);
}
.cmpbox.alt{ border-color:var(--alert); }
.cmpbox .k{ font-family:var(--mono); font-size:16px; line-height:19px; }
/* The ingredients are the largest type in the annotation; the drug names that
   caused the collision are demoted above them. The eye lands on the difference. */
.cmpbox .v{ font-size:21px; line-height:26px; font-weight:700; }
.cmpbox.alt .v{ color:var(--alert); }

.manual{ display:flex; flex-direction:column; gap:10px; }
.manual input{
  min-height:var(--t-resolve);
  border:2px solid var(--ink); border-radius:var(--r-control);
  padding:10px 14px; background:var(--paper);
  font-size:20px; font-weight:600;
}
.scrollhint{ font-size:16px; padding:var(--s4) 2px var(--s16); }

/* ------------------------------------------------------- completion bar -- */
.bar{
  flex:none;
  background:var(--shelf);
  border-top:2px solid var(--ink);
  padding:var(--s16);
  padding-bottom:calc(var(--s16) + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:var(--s12);
}
.cells{ display:flex; gap:3px; height:10px; }
.cells i{ flex:1; background:var(--paper); border:2px solid var(--line); }
.cells i.on{ background:var(--ink); border-color:var(--ink); }
.barline{
  font-family:var(--mono); font-size:19px; line-height:24px; font-weight:600;
  font-variant-numeric:tabular-nums slashed-zero;
}
/* The count sits in ink, not in `open`. The design's frame sets this line in
   `open`, but `open` on `shelf` computes to 6.29:1 — under the 7:1 the design's
   own tokens page promises for body text. The open-decision signal is carried
   by the 6px `open` rail immediately left of it, which is non-text and keeps
   the frame's structure intact. */
.barline.open{ color:var(--ink); }
.barsub{ font-size:16px; line-height:21px; }
.barnames{ font-size:16px; line-height:21px; font-weight:600; }
.barflag{ display:flex; align-items:center; gap:10px; }
.barflag i{ width:6px; align-self:stretch; min-height:24px; background:var(--open); flex:none; }
.barflag.alert i{ background:var(--alert); }
.complete{
  min-height:var(--t-resolve);
  border:2px solid var(--focus); background:var(--focus); color:var(--paper);
  border-radius:var(--r-control);
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:17px; font-weight:600;
}
.complete:hover{ background:var(--ink); border-color:var(--ink); }
/* b · decisions still open — the dashed slot sits exactly where the enabled
   button will appear. There is no greyed-out button anywhere in this product. */
.ghost{
  min-height:var(--t-resolve);
  border:2px dashed var(--line); background:transparent;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; padding:8px 12px; text-align:center;
}

/* ------------------------------------------------------------- overlay --- */
.overlay{
  position:fixed; inset:0; z-index:50;
  background:var(--shelf);
  display:flex; flex-direction:column;
}
.overlay .pane{
  flex:1; min-height:0; position:relative; overflow:hidden;
  background:var(--photo-ground);
  margin:var(--s12); border:2px solid var(--line);
  touch-action:none;
}
.overlay .pane img{
  position:absolute; top:0; left:0; width:700px; height:900px;
  transform-origin:0 0; will-change:transform;
}
.overlay .pane .outline{
  position:absolute; border:2.5px solid var(--focus);
  box-shadow:0 0 0 2px rgba(255,255,255,.85); pointer-events:none;
}
.overlay .pane .outline.dim{ border:2px dashed var(--line); box-shadow:none; }

/* --------------------------------------------------------------- capture -- */
.viewfinder{
  flex:1; min-height:0; position:relative; overflow:hidden; background:#2A2622;
  display:flex; align-items:center; justify-content:center;
}
.viewfinder img,.viewfinder video{
  position:absolute; top:50%; left:50%; width:700px; height:900px;
  transform-origin:50% 50%; object-fit:cover;
}
.guide{
  position:absolute; inset:8% 6%;
  border:3px solid rgba(255,255,255,.92);
  box-shadow:0 0 0 2px rgba(17,17,17,.45);
  pointer-events:none;
}
.guide::before,.guide::after{
  content:""; position:absolute; background:rgba(255,255,255,.92);
}
.warnwrap{
  position:absolute; left:var(--s12); right:var(--s12); bottom:var(--s12);
  display:flex; flex-direction:column; gap:var(--s8);
}
.warn{
  background:var(--paper); border:2px solid var(--ink);
  padding:10px var(--s12); display:flex; gap:10px;
}
.warn .gl{ font-family:var(--mono); font-size:19px; font-weight:700; line-height:22px; flex:none; }
.warn .t{ font-size:17px; line-height:22px; font-weight:600; }
.warn .f{ font-size:16px; line-height:21px; }
.warn.alert{ border-color:var(--alert); }
.warn.alert .gl,.warn.alert .t{ color:var(--alert); }
.warn.open .gl,.warn.open .t{ color:var(--open); }
.shutterzone{
  flex:none;
  background:var(--shelf); border-top:2px solid var(--ink);
  padding:var(--s16);
  padding-bottom:calc(var(--s16) + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:var(--s12);
}
.shutter{
  min-height:var(--t-resolve);
  border:2px solid var(--focus); background:var(--focus); color:var(--paper);
  border-radius:var(--r-control);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:600;
}
.filepick{ position:relative; display:block; }
.filepick input{
  position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer;
}

/* --------------------------------------------------------------- archive -- */
.arch-head{ flex:none; padding:var(--s16); display:flex; flex-direction:column; gap:var(--s12); background:var(--shelf); }
.search{
  display:flex; align-items:center; gap:10px;
  border:2px solid var(--ink); background:var(--paper); padding:0 var(--s12);
  min-height:var(--t-nav);
}
.search input{ flex:1; min-width:0; border:0; outline:none; background:transparent; font-size:17px; padding:10px 0; }
.search .gl{ font-family:var(--mono); font-size:18px; font-weight:700; }
.chips{ display:flex; gap:var(--s8); flex-wrap:wrap; }
.fchip{
  min-height:var(--t-nav); padding:0 var(--s12);
  border:2px solid var(--ink); background:var(--paper);
  border-radius:var(--r-control);
  display:flex; align-items:center; font-size:16px; font-weight:600;
}
.fchip.on{ background:var(--ink); color:var(--paper); }
.arch-list{ flex:1; min-height:0; overflow-y:auto; padding:0 var(--s16) var(--s16); display:flex; flex-direction:column; gap:var(--s8); }
/* The doctor-query row uses the same type, thumbnail and ink. It is not
   dimmed, not badged in warning colour, and not sorted to the bottom. */
.arow{
  display:flex; gap:var(--s12); align-items:stretch;
  border:2px solid var(--line); background:var(--paper);
  padding:var(--s12); text-align:left; width:100%;
}
.athumb{
  width:52px; height:66px; flex:none; overflow:hidden;
  border:2px solid var(--line); background:var(--photo-ground); position:relative;
}
.athumb img{ position:absolute; top:0; left:0; width:700px; height:900px; transform-origin:0 0; transform:scale(.0686); }
.arow .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.aname{ font-size:19px; line-height:24px; font-weight:700; }
.aing{ font-size:16px; line-height:21px; }
.ameta{ font-family:var(--mono); font-size:16px; line-height:21px; font-variant-numeric:tabular-nums slashed-zero; }
.count{ font-family:var(--mono); font-size:16px; font-variant-numeric:tabular-nums slashed-zero; }

/* ---------------------------------------------------------------- signin -- */
.signin{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; padding:var(--s16); gap:var(--s24); justify-content:center; }
.wordmark{
  font-size:34px; font-weight:700; letter-spacing:-.01em;
  background:none; border:0; padding:0; text-align:left;
  -webkit-user-select:none; user-select:none;
}
.staff{ display:flex; flex-direction:column; gap:var(--s8); }
.srow{
  display:flex; align-items:center; gap:var(--s12);
  border:2px solid var(--line); background:var(--paper);
  padding:var(--s12); width:100%; text-align:left; min-height:var(--t-resolve);
}
.srow .grow{ flex:1; min-width:0; }
.sname{ font-size:19px; font-weight:700; }
.srole{ font-size:16px; }
.saction{ font-family:var(--mono); font-size:16px; font-weight:700; }
.pinwrap{ display:flex; flex-direction:column; gap:var(--s16); }
.pindots{ display:flex; gap:var(--s12); justify-content:center; padding:var(--s8) 0; }
.pindots i{ width:16px; height:16px; border:2px solid var(--ink); background:var(--paper); border-radius:50%; }
.pindots i.on{ background:var(--ink); }
.keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s8); }
.keys button{ min-height:var(--t-resolve); font-family:var(--mono); font-size:23px; font-weight:700; }

/* ------------------------------------------------------------------ demo -- */
.demo{
  flex:none;
  background:var(--paper); border-top:3px solid var(--ink);
  padding:var(--s12); display:flex; flex-direction:column; gap:var(--s8);
  max-height:42vh; overflow-y:auto;
}
.demo h2{ font-size:17px; margin:0; }
.demo .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--s8); }
.demo button{ min-height:var(--t-nav); font-size:16px; font-weight:600; padding:var(--s8); }
.demo select{ min-height:var(--t-nav); font:inherit; border:2px solid var(--ink); background:var(--paper); border-radius:var(--r-control); padding:0 var(--s8); }

/* ============================ TABLET LANDSCAPE ============================
   The strip becomes a real left pane with the whole photo and the same linked
   outline, because there the room genuinely exists. Same DOM, same code path,
   CSS only. */
@media (min-width:900px) and (orientation:landscape){
  .screen{ max-width:none; }
  .verify-body{
    flex:1; min-height:0;
    display:grid; grid-template-columns:minmax(320px,44%) 1fr;
    /* The single row must be capped at the container's height. Left to
       `auto` it sizes to the tallest child, so the field column would
       overflow the pane and slide under the completion bar instead of
       scrolling inside itself. */
    grid-template-rows:minmax(0,1fr);
    gap:0;
  }
  /* The strip stops being a strip: it is a real left pane showing the whole
     sheet, with the same linked outline. Same DOM, same code path. */
  .verify .strip{
    flex:none; min-height:0;
    border-bottom:0; border-right:2px solid var(--ink);
    padding:var(--s16);
    display:flex; flex-direction:column;
  }
  .verify .crop{ height:auto; flex:1; min-height:0; }
  .verify .fields{ padding:var(--s16); }
}

   One self-contained file. No build step, no bundler, no CDN, no external

   file:// off a USB stick as well as hosted.

     TOKENS   — the CSS custom properties above are the single source of
                colour and type; this section only mirrors what JS needs.
     I18N     — { ru, az }, every visible string. No literals in code.
     MOCK     — sample prescriptions: field values, two readings, boxes.
     STATE    — session model + reducer-style transitions. The invariants.
     RENDER   — small pure render functions. textContent only.
     EVENTS   — delegated listeners.
     DEMO     — hidden demo controls.

"use strict";

   TOKENS
   The CSS `:root` block above is the source. JS reads from it rather than
   restating values, so there is exactly one place a colour is defined.

  read: function (name) {
    try {
      return getComputedStyle(document.documentElement)
        .getPropertyValue("--" + name).trim();
    } catch (e) { return ""; }

  // is always scaled to this fraction of the crop's width, so every field
  // arrives with the same proportion of surrounding paper around it: about a

  // a two-character quantity lands near 2.1x, a full directions line near
  // 0.57x, and the handwriting is readable either way.
  REGION_FRACTION: 0.692,

/* ===========================================================================
   STATE
   Session model and reducer-style transitions. The five product invariants
   are enforced HERE, in the state layer — not by disabling a control. Every
   one of them refuses at the function that performs the change, so forcing
   a click through the console or the keyboard cannot get past them.
   =========================================================================== */

// The six field states, plus `awaiting`, which is what a field is before its
// second reading has landed. `awaiting` is NOT a valid completion state.
var FIELD_STATE = {
  AWAITING:             "awaiting",
  AGREED:               "agreed",
  DISAGREEMENT:         "disagreement",
  ILLEGIBLE:            "illegible",
  ABSENT:               "absent",
  FLAG_NOT_IN_REGISTRY: "flag_not_in_registry",
  FLAG_LOOKALIKE:       "flag_lookalike"
};

var RESOLVABLE = {};
RESOLVABLE[FIELD_STATE.AGREED] = true;
RESOLVABLE[FIELD_STATE.DISAGREEMENT] = true;
RESOLVABLE[FIELD_STATE.ILLEGIBLE] = true;
RESOLVABLE[FIELD_STATE.ABSENT] = true;
RESOLVABLE[FIELD_STATE.FLAG_NOT_IN_REGISTRY] = true;
RESOLVABLE[FIELD_STATE.FLAG_LOOKALIKE] = true;

// How a resolution was arrived at. `source` records where the VALUE came
// from, which is what invariant 5 is checked against.
var SOURCE = {
  READING: "reading",   // one of the two readings, or both when they agreed
  MANUAL:  "manual",    // the pharmacist typed it
  ABSENT:  "absent",    // confirmed that the line is blank
  DOCTOR:  "doctor"     // routed to the prescriber; a normal terminal outcome
};

var SECOND_READING_INTERVAL_MS = 850;
// If the second reading has not finished within this long, the session is
// declared stalled. It does NOT become completable; it becomes explicitly
// blocked, with a retry and a doctor-follow-up route.
var SECOND_READING_TIMEOUT_MS = 12000;

var State = {
  lang: "ru",
  screen: "signin",
  user: null,
  pinFor: null,
  pin: "",
  session: null,
  archive: [],
  openRecord: null,
  capture: { warnIndex: 0, marginal: false, shot: null, cameraAvailable: null, frame: null },
  overlay: false,
  userMenu: false,
  archiveQuery: "",
  archiveFilter: "ingredient",
  demo: false,
  demoOpen: false,
  // Incremented whenever a session starts, resets or is abandoned. Every
  // timer carries the token it was created under and does nothing if the
  // token has moved on — this is what stops a stale reading from landing on
  // a session the user has already left.
  runToken: 0
};

/* -- storage ---------------------------------------------------------------
   file:// localStorage throws outright in some browsers, and can throw on
   write in private modes. Every call is wrapped and falls back to memory
   without breaking anything. Corrupt stored JSON is discarded, not trusted. */
var memoryStore = {};
var storageWorks = null;

function storeAvailable() {
  if (storageWorks !== null) return storageWorks;
  try {
    var k = "__siruply_probe__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    storageWorks = true;
  } catch (e) {
    storageWorks = false;
  }
  return storageWorks;
}

function storeGet(key) {
  try {
    if (storeAvailable()) return window.localStorage.getItem(key);
  } catch (e) { /* fall through to memory */ }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
}

function storeSet(key, value) {
  memoryStore[key] = value;
  try {
    if (storeAvailable()) window.localStorage.setItem(key, value);
  } catch (e) { /* quota or disabled: memory already holds it */ }
}

function storeRemove(key) {
  delete memoryStore[key];
  try {
    if (storeAvailable()) window.localStorage.removeItem(key);
  } catch (e) { /* nothing to do */ }
}

var K_SESSION = "siruply.session.v1";
var K_ARCHIVE = "siruply.archive.v1";
var K_LANG    = "siruply.lang.v1";
var K_USER    = "siruply.user.v1";

function readJSON(key) {
  var raw = storeGet(key);
  if (!raw) return null;
  try {
    var v = JSON.parse(raw);
    return (v && typeof v === "object") ? v : null;
  } catch (e) {
    // Corrupt or hostile: drop it and carry on with a clean slate.
    storeRemove(key);
    return null;
  }
}

function writeJSON(key, value) {
  try {
    storeSet(key, JSON.stringify(value));
  } catch (e) { /* circular or oversized: skip persistence, keep running */ }
}

/* -- session construction -------------------------------------------------- */

function sampleById(id) {
  for (var i = 0; i < SAMPLES.length; i++) if (SAMPLES[i].id === id) return SAMPLES[i];
  return SAMPLES[0];
}

function newSession(sampleId, user, opts) {
  opts = opts || {};
  var sample = sampleById(sampleId);
  var fields = sample.fields.map(function (f) {
    return {
      id: f.id,
      region: f.id,
      vtype: f.vtype || "text",
      first: f.first,
      second: f.second,
      illegible: !!f.illegible,
      absent: !!f.absent,
      catalogue: f.catalogue || null,
      ingredient: f.ingredient || null,
      landed: false,       // has the SECOND reading landed for this field
      resolution: null,
      demoState: null
    };
  });
  return {
    sampleId: sample.id,
    number: sample.number,
    branchId: sample.branchId,
    date: sample.date,
    by: user ? user.initials : "",
    byName: user ? user.name : "",
    fields: fields,
    focus: fields[0].id,
    boost: false,
    editing: null,
    draft: "",
    landedCount: 0,
    stalled: false,
    slowSecond: !!opts.slowSecond,
    failSecond: !!opts.failSecond,
    startedAt: Date.now()
  };
}

/* -- derivation ------------------------------------------------------------
   The state of a field is DERIVED, never stored. There is no code path that
   can write "agreed" onto a field whose second reading has not landed,
   because the state is computed from `landed` every time it is asked for. */
function fieldState(f) {
  if (!f) return FIELD_STATE.AWAITING;

  // INVARIANT 2 — a field cannot reach a settled-capable state before the
  // second reading has landed FOR THAT FIELD. This is the only gate, and it
  // sits ahead of every other branch, so the settled state is unreachable in
  // the state machine rather than merely hidden in the view.
  if (!f.landed) return FIELD_STATE.AWAITING;

  if (f.demoState) return f.demoState;      // DEMO only; see DEMO section
  if (f.absent) return FIELD_STATE.ABSENT;
  if (f.illegible || f.second === null) return FIELD_STATE.ILLEGIBLE;
  if (f.first !== f.second) return FIELD_STATE.DISAGREEMENT;
  if (f.catalogue && f.catalogue.kind === "lookalike") return FIELD_STATE.FLAG_LOOKALIKE;
  if (f.catalogue && f.catalogue.kind === "not_in_registry") return FIELD_STATE.FLAG_NOT_IN_REGISTRY;
  return FIELD_STATE.AGREED;
}

function fieldById(session, id) {
  if (!session) return null;
  for (var i = 0; i < session.fields.length; i++) {
    if (session.fields[i].id === id) return session.fields[i];
  }
  return null;
}

function openFields(session) {
  if (!session) return [];
  return session.fields.filter(function (f) { return !f.resolution; });
}

function landedCount(session) {
  if (!session) return 0;
  return session.fields.filter(function (f) { return f.landed; }).length;
}

function queryCount(session) {
  if (!session) return 0;
  return session.fields.filter(function (f) {
    return f.resolution && f.resolution.source === SOURCE.DOCTOR;
  }).length;
}

/* -- the two readings, unranked -------------------------------------------
   ORDERING RULE — the two readings are never ranked. They are ordered by
   the VALUE, not by which reading produced it:
       numeric values ascend;
       everything else sorts alphabetically by the interface locale.
   Naming the rule is what turns the top option from a recommendation into an
   accident of arithmetic. There is no preselection, no "recommended" marker,
   no model name and no confidence number anywhere in this data model or in
   the DOM it produces. */
function numericKey(v) {
  var m = String(v).match(/-?\d+(?:[.,]\d+)?/);
  if (!m) return null;
  return parseFloat(m[0].replace(",", "."));
}

function optionsFor(f) {
  var a = f.first, b = f.second;
  var na = numericKey(a), nb = numericKey(b);
  var numeric = (na !== null && nb !== null);
  var opts = [a, b];
  if (numeric) {
    opts.sort(function (x, y) { return numericKey(x) - numericKey(y); });
  } else {
    opts.sort(function (x, y) {
      return String(x).localeCompare(String(y), State.lang === "az" ? "az" : "ru");
    });
  }
  return { options: opts, numeric: numeric };
}

/* -- transitions ----------------------------------------------------------- */

function resolveField(fieldId, value, source, opts) {
  opts = opts || {};
  var s = State.session;
  if (!s) return { ok: false, reason: "no-session" };

  var f = fieldById(s, fieldId);
  if (!f) return { ok: false, reason: "no-field" };

  // INVARIANT 2, enforced again at the write. Deriving the state is not
  // enough on its own: this is the function that mutates, so this is where
  // a forced call has to be refused.
  if (!f.landed) return { ok: false, reason: "awaiting-second-reading" };

  var st = fieldState(f);
  if (!RESOLVABLE[st]) return { ok: false, reason: "not-resolvable:" + st };

  // INVARIANT 5 — catalogue hints annotate, never fill. A registry
  // suggestion must never become a field value by ANY code path, so the
  // value being written is checked against this field's catalogue entry
  // before it is stored.
  if (source === SOURCE.READING || source === SOURCE.MANUAL) {
    var cat = f.catalogue;
    if (cat) {
      var forbidden = [cat.similarName, cat.similarIngredient, cat.similarIngredientAz,
                       cat.mineIngredient, cat.mineIngredientAz];
      for (var i = 0; i < forbidden.length; i++) {
        if (forbidden[i] && String(value) === String(forbidden[i])) {
          return { ok: false, reason: "catalogue-cannot-fill-a-value" };
        }
      }
    }
  }

  // A reading-sourced value has to actually be one of the two readings.
  if (source === SOURCE.READING) {
    if (String(value) !== String(f.first) && String(value) !== String(f.second)) {
      return { ok: false, reason: "value-not-from-a-reading" };
    }
  }

  // Idempotent under a double tap: the first write wins, a second tap in the
  // same frame on a different option is refused rather than silently
  // overwriting a decision the pharmacist has already made.
  if (f.resolution) return { ok: false, reason: "already-resolved" };

  f.resolution = {
    value: value,
    source: source,
    note: opts.note || null,
    by: s.by,
    byName: s.byName,
    at: stamp()
  };
  s.editing = null;
  s.draft = "";
  s.focus = fieldId;
  // The control that was just used is about to be removed from the row, so
  // park focus on the field heading rather than letting it fall to <body>.
  pendingFocus = fieldId;
  lastResolveAt = Date.now();
  persistSession();
  announce(t("announceResolved") + labelFor(fieldId) + ", " + displayValue(f));
  return { ok: true };
}

// A resolved row replaces its control with "change this decision", which
// lands under the finger that just resolved the field. A double tap at a
// counter would otherwise resolve and immediately un-resolve, silently. The
// reopen control ignores taps that arrive within this window of the write.
var REOPEN_GRACE_MS = 500;
var lastResolveAt = 0;

function reopenField(fieldId) {
  var s = State.session;
  if (!s) return { ok: false, reason: "no-session" };
  if (Date.now() - lastResolveAt < REOPEN_GRACE_MS) {
    return { ok: false, reason: "too-soon-after-resolving" };
  }
  var f = fieldById(s, fieldId);
  if (!f) return { ok: false, reason: "no-field" };
  f.resolution = null;
  s.focus = fieldId;
  persistSession();
  return { ok: true };
}

/* INVARIANT 1 — a session cannot be completed while any field decision is
   open. The refusal lives in this function, not in the rendering of a
   button. Calling window.Siruply.complete() straight from the console with
   fields open returns {ok:false} and changes nothing. */
function completeSession() {
  var s = State.session;
  if (!s) return { ok: false, reason: "no-session" };

  var open = openFields(s);
  if (open.length > 0) {
    return {
      ok: false,
      reason: "open-fields",
      open: open.map(function (f) { return f.id; })
    };
  }

  // Belt and braces: even with every field resolved, a field whose second
  // reading never landed cannot have been resolved legitimately. If one is
  // found, refuse rather than write a record that claims two readings.
  var unlanded = s.fields.filter(function (f) { return !f.landed; });
  if (unlanded.length > 0) {
    return {
      ok: false,
      reason: "second-reading-incomplete",
      fields: unlanded.map(function (f) { return f.id; })
    };
  }

  var medicine = fieldById(s, "medicine");
  var sample = sampleById(s.sampleId);
  var record = {
    number: s.number,
    sampleId: s.sampleId,
    branchId: s.branchId,
    at: s.date + " " + stamp(),
    by: s.by,
    byName: s.byName,
    name: medicine && medicine.resolution ? medicine.resolution.value : "",
    ingredient: medicineIngredient(s, sample),
    queries: queryCount(s),
    total: s.fields.length,
    rows: s.fields.map(function (f) {
      return {
        id: f.id,
        value: f.resolution.value,
        i18nValue: f.resolution.source === SOURCE.DOCTOR,
        glyph: archiveGlyph(f),
        note: archiveNote(f)
      };
    })
  };

  State.archive.unshift(record);
  persistArchive();

  State.runToken++;          // stop any timer still in flight
  State.session = null;
  storeRemove(K_SESSION);
  State.openRecord = record;
  State.screen = "record";
  render();
  return { ok: true, record: record };
}

function medicineIngredient(s, sample) {
  var f = fieldById(s, "medicine");
  if (f && f.resolution && f.resolution.source === SOURCE.DOCTOR) return t("queriedValue");
  return (f && f.ingredient) ? f.ingredient : "";
}

function archiveGlyph(f) {
  if (!f.resolution) return "·";
  if (f.resolution.source === SOURCE.DOCTOR) return "~";
  if (f.resolution.source === SOURCE.ABSENT) return "∅";
  if (f.catalogue && f.catalogue.kind === "not_in_registry") return "!";
  return "✓";
}

function archiveNote(f) {
  var src = f.resolution ? f.resolution.source : null;
  if (src === SOURCE.DOCTOR) return "settledQueried";
  if (src === SOURCE.ABSENT) return "settledAbsent";
  if (src === SOURCE.MANUAL) return "settledManual";
  if (f.catalogue && f.catalogue.kind === "not_in_registry") return "settledAsIs";
  if (f.first === f.second) return "settledBoth";
  return "settledPicked";
}

/* -- role scoping ----------------------------------------------------------
   Enforced in the data access function, not in the view. A pharmacist can
   never obtain another branch's records, whatever a caller asks for. */
function archiveFor(user) {
  var all = State.archive.slice();
  if (!user) return [];
  if (user.role === "manager") return all;
  return all.filter(function (r) { return r.branchId === user.branchId; });
}

function searchArchive(user, query, filter) {
  var rows = archiveFor(user);          // scope FIRST, then search
  var q = String(query || "").trim().toLowerCase();
  if (!q) return rows;
  return rows.filter(function (r) {
    if (filter === "number") return String(r.number).toLowerCase().indexOf(q) >= 0;
    if (filter === "date")   return String(r.at).toLowerCase().indexOf(q) >= 0;
    return String(r.ingredient).toLowerCase().indexOf(q) >= 0 ||
           String(r.name).toLowerCase().indexOf(q) >= 0;
  });
}

/* -- the second reading ----------------------------------------------------
   Lands per field, in LAND_ORDER, and sets flags as it goes. Progress is
   reported in words and counts through an aria-live region: no spinner, no
   progress ring, no skeleton shimmer anywhere in this product. */
var readingTimer = null;

function stopReading() {
  if (readingTimer) { clearTimeout(readingTimer); readingTimer = null; }
}

function startSecondReading() {
  stopReading();
  var s = State.session;
  if (!s) return;

  // Every timer below carries the token it was created under. If the session
  // is replaced, reset or abandoned, the token moves and the pending timer
  // becomes a no-op — which is what keeps a reading from landing on a
  // session the user has already navigated away from.
  var token = State.runToken;
  var interval = s.slowSecond ? 2600 : SECOND_READING_INTERVAL_MS;
  var deadline = Date.now() + (s.slowSecond ? SECOND_READING_TIMEOUT_MS * 2 : SECOND_READING_TIMEOUT_MS);

  function step() {
    readingTimer = null;
    // Read the session fresh rather than closing over it: the session object
    // can be replaced between ticks.
    var cur = State.session;
    if (!cur || token !== State.runToken) return;

    if (cur.failSecond && landedCount(cur) >= 3) {
      cur.stalled = true;
      persistSession();
      announce(t("stalledTitle"));
      render();
      return;
    }

    if (Date.now() > deadline) {
      cur.stalled = true;
      persistSession();
      announce(t("stalledTitle"));
      render();
      return;
    }

    var next = null;
    for (var i = 0; i < LAND_ORDER.length; i++) {
      var f = fieldById(cur, LAND_ORDER[i]);
      if (f && !f.landed) { next = f; break; }
    }
    if (!next) {
      cur.stalled = false;
      persistSession();
      render();
      return;
    }

    next.landed = true;
    cur.landedCount = landedCount(cur);
    cur.stalled = false;
    persistSession();
    announce(t("announceLanded") + labelFor(next.id) + " — " +
             cur.landedCount + "/" + cur.fields.length);
    render();
    readingTimer = setTimeout(step, interval);
  }

  readingTimer = setTimeout(step, interval);
}

function retrySecondReading() {
  var s = State.session;
  if (!s) return;
  s.stalled = false;
  s.failSecond = false;
  State.runToken++;            // invalidate anything still pending
  persistSession();
  startSecondReading();
  render();
}

// The doctor-follow-up route out of a stalled session. Fields whose second
// reading never arrived cannot be "agreed", so they are routed to the
// prescriber — which is a normal terminal outcome, not a failure.
function routeStalledToDoctor() {
  var s = State.session;
  if (!s) return { ok: false, reason: "no-session" };
  var n = 0;
  s.fields.forEach(function (f) {
    if (f.resolution) return;
    // Landing the field here is explicit and recorded as a doctor query; it
    // never produces an agreed value, so invariant 2 is not sidestepped.
    f.landed = true;
    f.resolution = {
      value: t("queriedValue"),
      source: SOURCE.DOCTOR,
      note: "stalled",
      by: s.by, byName: s.byName, at: stamp()
    };
    n++;
  });
  s.stalled = false;
  s.landedCount = landedCount(s);
  State.runToken++;
  stopReading();
  persistSession();
  render();
  return { ok: true, routed: n };
}

/* -- persistence ----------------------------------------------------------- */
function persistSession() {
  if (State.session) writeJSON(K_SESSION, State.session);
  else storeRemove(K_SESSION);
}
function persistArchive() { writeJSON(K_ARCHIVE, State.archive); }

function restore() {
  var lang = storeGet(K_LANG);
  if (lang === "ru" || lang === "az") State.lang = lang;

  var arch = readJSON(K_ARCHIVE);
  State.archive = Array.isArray(arch) ? arch.filter(isSaneRecord) : seedArchive();
  if (!State.archive.length && !Array.isArray(arch)) State.archive = seedArchive();

  var u = readJSON(K_USER);
  if (u && u.id) {
    for (var i = 0; i < STAFF.length; i++) if (STAFF[i].id === u.id) State.user = STAFF[i];
  }

  var sess = readJSON(K_SESSION);
  if (sess && State.user && isSaneSession(sess)) {
    State.session = sess;
    State.screen = "verify";
  } else if (sess) {
    storeRemove(K_SESSION);
  }
}

// Stored state is untrusted input: it may have been hand-edited, truncated
// or corrupted. Anything that does not look like what we wrote is dropped.
function isSaneSession(s) {
  if (!s || typeof s !== "object") return false;
  if (!Array.isArray(s.fields) || s.fields.length === 0) return false;
  if (!PHOTO_SVG[s.sampleId]) return false;
  for (var i = 0; i < s.fields.length; i++) {
    var f = s.fields[i];
    if (!f || typeof f !== "object" || typeof f.id !== "string") return false;
    if (!REGIONS[f.region]) f.region = f.id;
    if (!REGIONS[f.region]) return false;
    if (f.resolution && typeof f.resolution !== "object") return false;
    f.landed = !!f.landed;
    f.demoState = null;        // never restored from storage
  }
  if (!fieldById(s, s.focus)) s.focus = s.fields[0].id;
  return true;
}

function isSaneRecord(r) {
  return !!(r && typeof r === "object" && typeof r.number === "string" &&
            typeof r.branchId === "string" && Array.isArray(r.rows));
}

/* -- small helpers --------------------------------------------------------- */
function stamp() {
  var d = new Date();
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }

function labelFor(id) { return t("f_" + id); }

function displayValue(f) {
  if (f.resolution) return f.resolution.value;
  return f.first;
}

function announce(msg) {
  var live = document.getElementById("live");
  if (live) live.textContent = msg;
}

/* ===========================================================================
   RENDER
   Small pure functions returning DOM. Text is always set with textContent —
   innerHTML is never given data, anywhere in this file.
   =========================================================================== */

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "style") n.setAttribute("style", v);
      else n.setAttribute(k, v === true ? "" : v);
    }
  }
  if (kids) {
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c === null || c === undefined || c === false) continue;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
  }
  return n;
}

function btn(attrs, kids) {
  var b = el("button", attrs, kids);
  b.setAttribute("type", "button");
  return b;
}

function statusbar(clock) {
  return el("div", { class: "statusbar" }, [
    el("span", { class: "num", text: clock || stamp() }),
    el("span", { class: "num", text: "LTE" })
  ]);
}

/* -- evidence strip --------------------------------------------------------
   A transformed <img> inside an overflow:hidden container, driven by the
   normalised coordinates in MOCK. The focused region is always scaled to the
   same fraction of the container width, so every field arrives with about a
   third again of surrounding paper around it and the zoom comes out
   per-field for free. The container is `contain:strict` with a fixed height,
   so changing the crop can never shift the field column below it. */
function cropGeometry(regionId, cw, ch) {
  var r = REGIONS[regionId] || REGIONS.patient;
  var bx = r[0] * PHOTO.w, by = r[1] * PHOTO.h;
  var bw = r[2] * PHOTO.w, bh = r[3] * PHOTO.h;

  var scale = (TOKENS.REGION_FRACTION * cw) / bw;
  // If the region is tall relative to the box, fit by height instead so the
  // outline never overflows the crop.
  var maxByHeight = (0.72 * ch) / bh;
  if (scale > maxByHeight) scale = maxByHeight;

  var outW = bw * scale, outH = bh * scale;
  var left = (cw - outW) / 2;
  var top = (ch - outH) / 2;
  // transform-origin is 0 0 and the order is scale() then translate(), so a
  // photo point p maps to scale * (p + t).
  var tx = left / scale - bx;
  var ty = top / scale - by;
  return { scale: scale, tx: tx, ty: ty, left: left, top: top, w: outW, h: outH };
}

// On a tablet in landscape the strip stops cropping and shows the whole
// sheet, with every region outlined and the focused one solid. It is the
// same element, the same data and the same function — only the framing
// changes, which is why the two layouts cannot drift apart.
function isPaneMode() {
  try { return window.matchMedia("(min-width:900px) and (orientation:landscape)").matches; }
  catch (e) { return false; }
}

function placeOutline(o, scale, ox, oy) {
  var r = REGIONS[o.getAttribute("data-oregion")];
  if (!r) return;
  o.style.left = (ox + r[0] * PHOTO.w * scale) + "px";
  o.style.top = (oy + r[1] * PHOTO.h * scale) + "px";
  o.style.width = (r[2] * PHOTO.w * scale) + "px";
  o.style.height = (r[3] * PHOTO.h * scale) + "px";
}

function applyCrop(cropEl) {
  var img = cropEl.querySelector("img");
  if (!img) return;
  var outlines = cropEl.querySelectorAll(".outline");
  var regionId = cropEl.getAttribute("data-region");
  var cw = cropEl.clientWidth || 340;
  var ch = cropEl.clientHeight || 164;
  var pane = isPaneMode() && cropEl.getAttribute("data-pane") === "1";

  if (pane) {
    var s = Math.min(cw / PHOTO.w, ch / PHOTO.h);
    var ox = (cw - PHOTO.w * s) / 2;
    var oy = (ch - PHOTO.h * s) / 2;
    img.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
    Array.prototype.forEach.call(outlines, function (o) {
      o.hidden = false;
      var focused = o.getAttribute("data-oregion") === regionId;
      if (focused) o.classList.remove("dim"); else o.classList.add("dim");
      placeOutline(o, s, ox, oy);
    });
    return;
  }

  var g = cropGeometry(regionId, cw, ch);
  img.style.transform = "scale(" + g.scale + ") translate(" + g.tx + "px," + g.ty + "px)";
  Array.prototype.forEach.call(outlines, function (o) {
    var focused = o.getAttribute("data-oregion") === regionId;
    o.hidden = !focused;
    o.classList.remove("dim");
    if (!focused) return;
    o.style.left = g.left + "px";
    o.style.top = g.top + "px";
    o.style.width = g.w + "px";
    o.style.height = g.h + "px";
  });
}

function evidenceStrip(session) {
  var focusField = fieldById(session, session.focus) || session.fields[0];
  var index = session.fields.indexOf(focusField) + 1;

  var crop = el("div", {
    class: "crop",
    "data-region": focusField.region,
    "data-pane": "1",
    "data-act": "open-photo",
    role: "button",
    tabindex: "0",
    "aria-label": t("openFull")
  }, [
    el("img", {
      src: photoURI(session.sampleId),
      alt: "",
      style: session.boost ? "filter:" + TOKENS.BOOST_FILTER : ""
    })
  ]);
  // One outline per field region. On the phone all but the focused one are
  // hidden; in the tablet pane they all show, the others dashed.
  session.fields.forEach(function (f) {
    crop.appendChild(el("div", {
      class: "outline" + (f.id === focusField.id ? "" : " dim"),
      "data-oregion": f.region,
      hidden: f.id === focusField.id ? null : true
    }));
  });

  return el("div", { class: "strip" }, [
    crop,
    el("div", { class: "striprow" }, [
      el("div", { class: "grow" }, [
        el("div", { class: "strip-label", text: labelFor(focusField.id) }),
        el("div", { class: "strip-index",
          text: fieldCaption(index, session.fields.length) +
                (isPaneMode() ? " \u00B7 " + t("othersDashed") : "") })
      ]),
      btn({
        class: "iconbtn wide" + (session.boost ? " on" : ""),
        "data-act": "boost",
        "aria-pressed": session.boost ? "true" : "false"
      }, [
        el("span", { class: "mono", text: session.boost ? "◕" : "◐" }),
        el("span", { style: "font-size:16px;font-weight:600", text: t("boost") })
      ]),
      btn({ class: "iconbtn", "data-act": "open-photo", "aria-label": t("openFull") },
          [el("span", { class: "mono", text: "⤢" })])
    ])
  ]);
}

/* -- field rows ------------------------------------------------------------
   Six states, each identifiable in greyscale by glyph, label and row
   structure. Colour only reinforces; it never carries the state. */

function rowShell(f, state, kids) {
  var railClass = "rail";
  if (state === FIELD_STATE.AWAITING) railClass += " hollow";
  else if (state === FIELD_STATE.ABSENT) railClass += " dashed";
  else if (state === FIELD_STATE.FLAG_LOOKALIKE) railClass += " alert";
  else if (state === FIELD_STATE.AGREED) railClass += "";
  else railClass += " open";
  if (f.resolution) railClass = "rail";

  var row = el("div", {
    class: "row" + (state === FIELD_STATE.FLAG_LOOKALIKE && !f.resolution ? " is-lookalike" : ""),
    "data-field": f.id,
    "data-state": f.resolution ? "settled" : state
  }, [
    el("div", { class: railClass }),
    el("div", { class: "rowbody" }, kids)
  ]);
  return row;
}

function head(f, glyph, badgeClass) {
  return el("div", { class: "rowhead" }, [
    el("div", {
      class: "flabel", text: labelFor(f.id),
      id: "flabel-" + f.id, tabindex: "-1"
    }),
    el("div", {
      class: "badge" + (badgeClass ? " " + badgeClass : ""),
      "aria-hidden": "true", text: glyph
    })
  ]);
}

function valueEl(f, value) {
  var cls = "fvalue";
  if (f.vtype === "name") cls += " name";
  else if (f.vtype === "num") cls += " num";
  return el("div", { class: cls, text: value });
}

function settledRow(f) {
  var r = f.resolution;
  var glyph = r.source === SOURCE.DOCTOR ? "~"
            : r.source === SOURCE.ABSENT ? "∅" : "✓";
  var noteKey = r.source === SOURCE.DOCTOR ? "queriedNote"
              : r.source === SOURCE.ABSENT ? "settledAbsent"
              : r.source === SOURCE.MANUAL ? "settledManual"
              : (f.catalogue && f.catalogue.kind === "not_in_registry") ? "settledAsIs"
              : (f.first === f.second) ? "settledBoth" : "settledPicked";

  return rowShell(f, "settled", [
    head(f, glyph, r.source === SOURCE.DOCTOR ? null : "filled"),
    valueEl(f, r.value),
    el("div", { class: "fnote" }, [
      document.createTextNode(r.source === SOURCE.DOCTOR ? "" : t("settled")),
      el("span", { class: "num", text: r.by + " " + r.at }),
      document.createTextNode(t(noteKey))
    ]),
    btn({ class: "act", "data-act": "reopen", "data-field": f.id },
        [el("span", { class: "lbl", text: t("reopen") })])
  ]);
}

/* Awaiting: the fast reading's value is shown at full size and full
   contrast, because reading it is useful work. What is withheld is not the
   information but the ability to act on it — note what is absent here: no
   confirm button, no state label, no glyph badge with meaning. There is
   nothing to tap, so there is no way to accept it. */
function awaitingRow(f, stalled) {
  return rowShell(f, FIELD_STATE.AWAITING, [
    head(f, "·", "await"),
    valueEl(f, f.first),
    el("div", { class: "fawait", text: stalled ? t("stalledField") : t("s_awaiting") })
  ]);
}

function agreedRow(f) {
  return rowShell(f, FIELD_STATE.AGREED, [
    head(f, "=", null),
    valueEl(f, f.first),
    el("div", { class: "fstate", text: t("s_agreed") }),
    btn({ class: "act primary", "data-act": "confirm", "data-field": f.id,
          style: "margin-top:2px" }, [
      el("span", { class: "gl", text: "=" }),
      el("span", { class: "lbl", text: t("confirm") })
    ])
  ]);
}

/* Disagreement: three options of identical border, fill, height and type.
   "Enter my own" is the third option in the same stack, not a link
   underneath, so disagreeing with both machines costs the same single tap as
   agreeing with one. The sort rule is stated in the row's last line. */
function disagreementRow(f, session) {
  var o = optionsFor(f);
  var kids = [
    head(f, "⇄", "open g-swap"),
    el("div", { class: "fstate open", text: t("s_disagreement") })
  ];

  if (session.editing === f.id) {
    kids.push(manualEntry(f, session));
  } else {
    var opts = el("div", { class: "opts" });
    o.options.forEach(function (v) {
      opts.appendChild(btn({ class: "opt", "data-act": "pick", "data-field": f.id, "data-value": v },
        [el("span", { class: "optv" + (o.numeric ? " num" : ""), text: v })]));
    });
    opts.appendChild(btn({ class: "opt", "data-act": "edit", "data-field": f.id },
      [el("span", { class: "optv", text: t("enterOwn") })]));
    kids.push(opts);
    kids.push(el("div", { class: "orderrule", text: o.numeric ? t("orderNum") : t("orderTxt") }));
  }
  return rowShell(f, FIELD_STATE.DISAGREEMENT, kids);
}

/* Illegible: two actions, side by side, equal width, equal weight, one tap
   each. Neither is red and neither is behind a menu — asking the doctor is
   an outcome, not a failure. */
function illegibleRow(f, session) {
  var kids = [
    head(f, "~", "open g-tilde"),
    el("div", { class: "fstate open", text: t("s_illegible") })
  ];
  if (session.editing === f.id) {
    kids.push(manualEntry(f, session));
  } else {
    kids.push(el("div", { class: "pair" }, [
      btn({ class: "act", "data-act": "edit", "data-field": f.id },
          [el("span", { class: "lbl", text: t("enterManual") })]),
      btn({ class: "act", "data-act": "doctor", "data-field": f.id },
          [el("span", { class: "lbl", text: t("askDoctor") })])
    ]));
  }
  return rowShell(f, FIELD_STATE.ILLEGIBLE, kids);
}

/* Absent: dashed rail, dashed badge, and a struck empty slot — the literal
   claim being confirmed is that this line of the prescription is blank.
   Three axes of difference from illegible, the pair most expensive to
   confuse. */
function absentRow(f) {
  return rowShell(f, FIELD_STATE.ABSENT, [
    head(f, "∅", "dashed"),
    el("div", { class: "slot" }, [el("i")]),
    el("div", { class: "fstate open", text: t("s_absent") }),
    btn({ class: "act", "data-act": "confirm-absent", "data-field": f.id }, [
      el("span", { class: "gl", text: "∅" }),
      el("span", { class: "lbl", text: t("confirmAbsent") })
    ])
  ]);
}

/* Not in the registry: the annotation is indented past the value's left
   edge, sits on shelf rather than paper, is set at body size and weight, and
   is below the value it comments on. It also says in words that it does not
   fill anything in. */
function registryRow(f, session) {
  var kids = [
    head(f, "!", "open"),
    valueEl(f, f.first),
    el("div", { class: "note" }, [
      el("div", { class: "gl", "aria-hidden": "true", text: "!" }),
      el("div", { class: "body" }, [
        el("b", { text: t("s_registry") }),
        document.createTextNode(" " + t("registryBody"))
      ])
    ])
  ];
  if (session.editing === f.id) {
    kids.push(manualEntry(f, session));
  } else {
    kids.push(btn({ class: "act primary", "data-act": "confirm-as-is", "data-field": f.id }, [
      el("span", { class: "gl", text: "=" }),
      el("span", { class: "lbl", text: t("confirmAsIs") })
    ]));
  }
  return rowShell(f, FIELD_STATE.FLAG_NOT_IN_REGISTRY, kids);
}

/* Look-alike: the two active ingredients are the largest type in the
   annotation and the drug names that caused the collision are demoted to
   mono captions above them. The comparison is inverted on purpose — the
   confusable strings are small, the thing that actually differs is big. The
   boxes are stacked, never side by side, so the ingredients sit directly
   above one another where the divergence cannot be missed.

   "Ask the doctor" is listed first and confirming second, separated by a
   24px gap: the more cautious action is closer to the thumb, and the confirm
   names the specific drug it commits to rather than saying OK. */
function lookalikeRow(f, session) {
  var c = f.catalogue;
  var az = State.lang === "az";
  var mineIng = az && c.mineIngredientAz ? c.mineIngredientAz : c.mineIngredient;
  var simIng = az && c.similarIngredientAz ? c.similarIngredientAz : c.similarIngredient;

  var title = az
    ? c.similarName + t("s_lookalikeB")
    : t("s_lookalikeA") + c.similarName + t("s_lookalikeB");

  var kids = [
    head(f, "≠", "alert"),
    valueEl(f, f.first),
    el("div", { class: "note alert" }, [
      el("div", { class: "note-title" }, [
        el("div", { class: "gl", "aria-hidden": "true", style: "color:var(--alert)", text: "≠" }),
        el("div", { class: "t", text: title })
      ]),
      el("div", { class: "cmp" }, [
        el("div", { class: "cmpbox" }, [
          el("div", { class: "k", text: t("inRx") + c.mineName }),
          el("div", { class: "v", text: mineIng })
        ]),
        el("div", { class: "cmpbox alt" }, [
          el("div", { class: "k", text: t("similar") + c.similarName }),
          el("div", { class: "v", text: simIng })
        ])
      ]),
      el("div", { class: "body", text: t("lookalikeBody") })
    ])
  ];

  if (session.editing === f.id) {
    kids.push(manualEntry(f, session));
  } else {
    kids.push(el("div", { class: "stack safety" }, [
      btn({ class: "act", "data-act": "doctor", "data-field": f.id },
          [el("span", { class: "lbl", text: t("askDoctor") })]),
      btn({ class: "act primary", "data-act": "confirm", "data-field": f.id },
          [el("span", { class: "lbl", text: t("confirmNamed") + c.mineName })])
    ]));
  }
  return rowShell(f, FIELD_STATE.FLAG_LOOKALIKE, kids);
}

function manualEntry(f, session) {
  return el("div", { class: "manual" }, [
    el("input", {
      type: "text", "data-act": "draft", "data-field": f.id,
      value: session.draft || "",
      placeholder: t("typeHere"),
      "aria-label": t("typeHere") + " — " + labelFor(f.id)
    }),
    el("div", { class: "pair" }, [
      btn({ class: "act", "data-act": "cancel-edit", "data-field": f.id },
          [el("span", { class: "lbl", text: t("cancel") })]),
      btn({ class: "act primary", "data-act": "save-manual", "data-field": f.id },
          [el("span", { class: "lbl", text: t("save") })])
    ])
  ]);
}

function fieldRow(f, session) {
  if (f.resolution) return settledRow(f);
  var st = fieldState(f);
  switch (st) {
    case FIELD_STATE.AWAITING:             return awaitingRow(f, session.stalled);
    case FIELD_STATE.AGREED:               return agreedRow(f);
    case FIELD_STATE.DISAGREEMENT:         return disagreementRow(f, session);
    case FIELD_STATE.ILLEGIBLE:            return illegibleRow(f, session);
    case FIELD_STATE.ABSENT:               return absentRow(f);
    case FIELD_STATE.FLAG_NOT_IN_REGISTRY: return registryRow(f, session);
    case FIELD_STATE.FLAG_LOOKALIKE:       return lookalikeRow(f, session);
    default:                               return awaitingRow(f, session.stalled);
  }
}

/* -- completion bar --------------------------------------------------------
   Three configurations. The button is REPLACED, not greyed: in a and b there
   is no completion element on screen at all, because a greyed-out button is
   still a button and a tired hand taps it anyway to see what happens. */
function completionBar(session) {
  var total = session.fields.length;
  var landed = landedCount(session);
  var open = openFields(session);
  var queries = queryCount(session);

  // d · the second reading never arrived. Not in /design/; built to the same
  // rule — withhold the capability, and put a sentence with counts in its
  // place. The session does NOT become completable.
  if (session.stalled) {
    var missing = session.fields.filter(function (f) { return !f.landed; });
    return el("div", { class: "bar" }, [
      el("div", { class: "barflag alert" }, [
        el("i"),
        el("div", { class: "barline open", text: t("stalledTitle") })
      ]),
      el("div", { class: "barnames", text: t("stalledBodyA") + missing.length }),
      el("div", { class: "barsub", text: t("stalledBody") }),
      el("div", { class: "stack" }, [
        btn({ class: "act primary", "data-act": "retry-reading" },
            [el("span", { class: "lbl", text: t("stalledRetry") })]),
        btn({ class: "act", "data-act": "route-doctor" },
            [el("span", { class: "lbl", text: t("stalledRoute") })])
      ])
    ]);
  }

  // a · second reading in flight. Counts, not progress. Seven cells, the
  // same hollow-to-solid language as the field rails.
  if (landed < total) {
    var cells = el("div", { class: "cells", "aria-hidden": "true" });
    for (var i = 0; i < total; i++) cells.appendChild(el("i", { class: i < landed ? "on" : "" }));
    return el("div", { class: "bar" }, [
      cells,
      el("div", { class: "barline", text: t("barSecondA") + landed + t("barSecondB") + total + t("barSecondC") }),
      el("div", { class: "barsub", text: t("barSecondSub") })
    ]);
  }

  // b · decisions still open. The open fields are named, so the remaining
  // work is legible without scrolling, and the dashed slot sits exactly
  // where the enabled button will appear.
  if (open.length > 0) {
    return el("div", { class: "bar" }, [
      el("div", { class: "barflag" }, [
        el("i"),
        el("div", { class: "barline open", text: t("barOpen") + open.length })
      ]),
      el("div", { class: "barnames", text: open.map(function (f) { return labelFor(f.id); }).join(" · ") }),
      el("div", { class: "barsub", text: t("barOpenSub") }),
      el("div", { class: "ghost", text: t("completeUnavailable") })
    ]);
  }

  // c · ready. The only configuration with a filled button, and it reports
  // the doctor-query count as ordinary summary information.
  var summary = total + t("barReadyA") + total + t("barReadyB");
  if (queries > 0) summary += t("barQueries") + queries;
  return el("div", { class: "bar" }, [
    el("div", { class: "barline", text: summary }),
    btn({ class: "complete", "data-act": "complete" },
        [el("span", { text: t("complete") })])
  ]);
}

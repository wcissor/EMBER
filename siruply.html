/* -- root render ----------------------------------------------------------- */
var pendingFocus = null;

function render() {
  var app = document.getElementById("app");
  if (!app) return;

  var scrollTop = 0;
  var oldCol = document.getElementById("fieldcol");
  if (oldCol) scrollTop = oldCol.scrollTop;

  var screen;
  if (State.screen === "signin") screen = signinScreen();
  else if (State.screen === "capture") screen = captureScreen();
  else if (State.screen === "verify") screen = verifyScreen();
  else if (State.screen === "record") screen = recordScreen();
  else screen = archiveScreen();

  app.textContent = "";
  app.appendChild(screen);

  if (State.overlay && State.screen === "verify") {
    var ov = photoOverlay();
    if (ov) app.appendChild(ov);
  }

  if (State.demo && State.demoOpen) app.appendChild(demoPanel());

  // Lay the crops out after the nodes are in the document, so clientWidth is real.
  Array.prototype.forEach.call(document.querySelectorAll(".crop"), applyCrop);
  layoutFullPane();

  var col = document.getElementById("fieldcol");
  if (col && scrollTop) col.scrollTop = scrollTop;

  document.documentElement.lang = State.lang === "az" ? "az" : "ru";

  if (pendingFocus) {
    var target = document.getElementById("flabel-" + pendingFocus);
    pendingFocus = null;
    if (target) {
      try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); }
      var row = target.closest ? target.closest(".row") : null;
      if (row && row.scrollIntoView) {
        row.scrollIntoView({ block: "nearest",
          behavior: prefersReducedMotion() ? "auto" : "smooth" });
      }
    }
  }
}

function prefersReducedMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { return false; }
}

function layoutFullPane() {
  var pane = document.getElementById("fullpane");
  if (!pane) return;
  var img = pane.querySelector("img");
  if (!img) return;
  var cw = pane.clientWidth, ch = pane.clientHeight;
  var base = Math.min(cw / PHOTO.w, ch / PHOTO.h);
  var scale = base * zoom.level;
  var ox = (cw - PHOTO.w * scale) / 2 + zoom.x;
  var oy = (ch - PHOTO.h * scale) / 2 + zoom.y;
  img.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + scale + ")";

  Array.prototype.forEach.call(pane.querySelectorAll(".outline"), function (o) {
    var r = REGIONS[o.getAttribute("data-oregion")];
    if (!r) return;
    o.style.left = (ox + r[0] * PHOTO.w * scale) + "px";
    o.style.top = (oy + r[1] * PHOTO.h * scale) + "px";
    o.style.width = (r[2] * PHOTO.w * scale) + "px";
    o.style.height = (r[3] * PHOTO.h * scale) + "px";
  });
}

/* ===========================================================================
   EVENTS
   One delegated click listener, one delegated input listener, plus the
   pointer handlers the full-photo overlay needs.
   =========================================================================== */

var zoom = { level: 1, x: 0, y: 0 };

function currentSampleId() {
  return State.capture.sampleId || SAMPLES[0].id;
}

function actOn(node) {
  while (node && node !== document.body) {
    if (node.getAttribute && node.getAttribute("data-act")) return node;
    node = node.parentNode;
  }
  return null;
}

function focusField(id) {
  var s = State.session;
  if (!s) return;
  if (s.focus === id) return;
  s.focus = id;
  persistSession();
  pendingFocus = id;
  announce(t("announceFocus") + labelFor(id));
  render();
}

function handleClick(e) {
  var node = actOn(e.target);

  // Tapping anywhere in a row focuses that field and moves the evidence strip.
  if (!node || !node.getAttribute("data-act")) {
    var row = e.target.closest ? e.target.closest(".row[data-field]") : null;
    if (row && State.screen === "verify") focusField(row.getAttribute("data-field"));
    return;
  }

  var act = node.getAttribute("data-act");
  var fieldId = node.getAttribute("data-field");
  var s = State.session;

  // Focus follows the row a control lives in, before the control acts.
  if (fieldId && s && act !== "draft") {
    var rowNode = node.closest ? node.closest(".row[data-field]") : null;
    if (rowNode) {
      var rid = rowNode.getAttribute("data-field");
      if (s.focus !== rid) { s.focus = rid; }
    }
  }

  switch (act) {
    case "lang":
      State.lang = State.lang === "ru" ? "az" : "ru";
      storeSet(K_LANG, State.lang);
      render();
      return;

    case "wordmark":
      return;   // long-press is handled separately; a plain tap does nothing

    case "pick-user":
      State.pinFor = node.getAttribute("data-user");
      State.pin = "";
      render();
      return;

    case "pin-key": {
      if (State.pin.length >= 4) return;
      State.pin += node.getAttribute("data-key");
      if (State.pin.length === 4) {
        // Mock auth: any four digits are accepted. Real PIN verification is
        // a server concern and is out of scope for a single-file demo.
        var picked = null;
        for (var i = 0; i < STAFF.length; i++) if (STAFF[i].id === State.pinFor) picked = STAFF[i];
        if (picked) signIn(picked);
        return;
      }
      render();
      return;
    }
    case "pin-back":
      State.pin = State.pin.slice(0, -1);
      render();
      return;
    case "pin-cancel":
      State.pinFor = null; State.pin = "";
      render();
      return;

    case "user-menu":
      State.userMenu = !State.userMenu;
      render();
      return;
    case "close-menu":
      State.userMenu = false;
      render();
      return;
    case "switch-user": {
      // Fast user switch without a full sign-out: the counter device is
      // shared across a shift, and the branch belongs to the device.
      var id = node.getAttribute("data-user");
      var next = null;
      for (var j = 0; j < STAFF.length; j++) if (STAFF[j].id === id) next = STAFF[j];
      if (!next) return;
      State.userMenu = false;
      State.pinFor = id;
      State.pin = "";
      State.screen = "signin";
      render();
      return;
    }

    case "new-shot":
      State.capture = { warnIndex: 0, marginal: false, shot: null,
                        cameraAvailable: State.capture.cameraAvailable,
                        frame: null, sampleId: State.capture.sampleId || SAMPLES[0].id };
      State.screen = "capture";
      render();
      startCapture();
      return;

    case "capture-cancel":
      stopCamera();
      State.screen = "archive";
      render();
      return;

    case "shoot":
      stopCamera();
      State.capture.shot = true;
      render();
      return;

    case "retake":
      State.capture.shot = null;
      State.capture.frame = null;
      render();
      startCapture();
      return;

    case "process":
      beginSession(currentSampleId());
      return;

    case "resume":
      if (!State.session) return;
      State.screen = "verify";
      State.overlay = false;
      State.userMenu = false;
      render();
      // The reading was stopped on the way out; pick it up where it stopped.
      if (!State.session.stalled && landedCount(State.session) < State.session.fields.length) {
        State.runToken++;
        startSecondReading();
      }
      return;

    case "to-archive":
      // Leaving mid-session keeps the session (it is resumable) but stops the
      // reading timers by moving the run token.
      State.overlay = false;
      State.userMenu = false;
      State.screen = "archive";
      State.runToken++;
      stopReading();
      render();
      return;

    case "open-photo":
      if (!State.session) return;
      zoom = { level: 1, x: 0, y: 0 };
      State.overlay = true;
      render();
      return;
    case "close-photo":
      State.overlay = false;
      render();
      return;

    case "boost":
      if (!s) return;
      s.boost = !s.boost;
      persistSession();
      render();
      return;

    case "confirm": {
      var f = fieldById(s, fieldId);
      if (!f) return;
      var r = resolveField(fieldId, f.first, SOURCE.READING);
      if (r.ok) render();
      return;
    }
    case "confirm-as-is": {
      var f2 = fieldById(s, fieldId);
      if (!f2) return;
      // The value confirmed is the READING, never the catalogue's suggestion.
      var r2 = resolveField(fieldId, f2.first, SOURCE.READING);
      if (r2.ok) render();
      return;
    }
    case "pick": {
      var r3 = resolveField(fieldId, node.getAttribute("data-value"), SOURCE.READING);
      if (r3.ok) render();
      return;
    }
    case "confirm-absent": {
      var r4 = resolveField(fieldId, t("s_absent"), SOURCE.ABSENT);
      if (r4.ok) render();
      return;
    }
    case "doctor": {
      var r5 = resolveField(fieldId, t("queriedValue"), SOURCE.DOCTOR);
      if (r5.ok) render();
      return;
    }
    case "edit":
      if (!s) return;
      s.editing = fieldId;
      s.draft = "";
      render();
      return;
    case "cancel-edit":
      if (!s) return;
      s.editing = null;
      s.draft = "";
      render();
      return;
    case "save-manual": {
      if (!s) return;
      var text = String(s.draft || "").trim();
      if (!text) return;
      var r6 = resolveField(fieldId, text, SOURCE.MANUAL);
      if (r6.ok) render();
      return;
    }
    case "reopen":
      if (reopenField(fieldId).ok) render();
      return;

    case "retry-reading":
      retrySecondReading();
      return;
    case "route-doctor":
      routeStalledToDoctor();
      return;

    case "complete": {
      var res = completeSession();
      if (!res.ok) {
        // Refused in the state layer. Say what is still open rather than
        // failing silently.
        announce(t("barOpen") + (res.open ? res.open.length : 0));
        render();
      }
      return;
    }

    case "filter":
      State.archiveFilter = node.getAttribute("data-filter");
      render();
      return;
    case "clear-search":
      State.archiveQuery = "";
      render();
      return;

    case "open-record": {
      var num = node.getAttribute("data-number");
      // Go back through the scoped accessor: a record the current user may
      // not see cannot be opened by number either.
      var visible = archiveFor(State.user);
      var found = null;
      for (var k = 0; k < visible.length; k++) if (visible[k].number === num) found = visible[k];
      if (!found) return;
      State.openRecord = found;
      State.screen = "record";
      render();
      return;
    }

    default:
      return;
  }
}

function handleInput(e) {
  var node = e.target;
  var act = node.getAttribute && node.getAttribute("data-act");
  if (act === "draft") {
    if (State.session) State.session.draft = node.value;
    return;
  }
  if (act === "search") {
    State.archiveQuery = node.value;
    var live = document.querySelector(".count");
    var rows = searchArchive(State.user, State.archiveQuery, State.archiveFilter);
    if (live) live.textContent = t("found") + rows.length;
    var list = document.querySelector(".arch-list");
    if (list) {
      // Re-render only the list, so the input keeps focus and the caret.
      var fresh = archiveScreen().querySelector(".arch-list");
      list.parentNode.replaceChild(fresh, list);
    }
    return;
  }
  if (act === "file") {
    var file = node.files && node.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      State.capture.frame = String(reader.result || "");
      State.capture.shot = true;
      render();
    };
    reader.onerror = function () {
      // Unreadable file: fall back to the bundled sample rather than a dead end.
      State.capture.frame = null;
      State.capture.shot = true;
      render();
    };
    try { reader.readAsDataURL(file); }
    catch (err) { State.capture.shot = true; render(); }
  }
}

function handleKeydown(e) {
  if (e.key === "Escape") {
    if (State.overlay) { State.overlay = false; render(); return; }
    if (State.userMenu) { State.userMenu = false; render(); return; }
    if (State.demoOpen) { State.demoOpen = false; render(); return; }
  }
  // Enter/Space on the crop (it is a role=button div)
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.classList &&
      e.target.classList.contains("crop")) {
    e.preventDefault();
    State.overlay = true;
    zoom = { level: 1, x: 0, y: 0 };
    render();
  }
  if (e.key === "Enter" && e.target && e.target.getAttribute &&
      e.target.getAttribute("data-act") === "draft") {
    e.preventDefault();
    var id = e.target.getAttribute("data-field");
    if (State.session) State.session.draft = e.target.value;
    var r = resolveField(id, String(State.session.draft || "").trim(), SOURCE.MANUAL);
    if (r.ok) render();
  }
}

function signIn(user) {
  State.user = user;
  State.pinFor = null;
  State.pin = "";
  writeJSON(K_USER, { id: user.id });
  State.userMenu = false;
  // A user switch mid-session returns to the session, which is the point of
  // switching without a sign-out.
  if (State.session) {
    State.session.by = user.initials;
    State.session.byName = user.name;
    State.screen = "verify";
    persistSession();
    render();
    startSecondReading();
    return;
  }
  State.screen = "archive";
  render();
}

function beginSession(sampleId) {
  stopCamera();
  State.runToken++;
  stopReading();
  var opts = {
    slowSecond: !!State.capture.slowSecond,
    failSecond: !!State.capture.failSecond
  };
  State.session = newSession(sampleId, State.user, opts);
  State.screen = "verify";
  State.overlay = false;
  persistSession();
  render();
  startSecondReading();
}

/* -- capture: live camera with a graceful fallback -------------------------
   getUserMedia is tried first. On file:// the context is insecure and the
   API is either absent or rejects; the <input type=file capture=environment>
   path below works everywhere, including file://, and reaches exactly the
   same result. */
var mediaStream = null;

function stopCamera() {
  if (mediaStream) {
    try { mediaStream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
    mediaStream = null;
  }
}

function startCapture() {
  var secure = false;
  try { secure = !!window.isSecureContext; } catch (e) { secure = false; }
  var has = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  if (!secure || !has) {
    State.capture.cameraAvailable = false;
    render();
    return;
  }

  var token = ++cameraToken;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function (stream) {
      if (token !== cameraToken || State.screen !== "capture") {
        try { stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
        return;
      }
      mediaStream = stream;
      State.capture.cameraAvailable = true;
      var vf = document.querySelector(".viewfinder");
      if (!vf) return;
      var still = document.getElementById("vf-still");
      if (still && still.parentNode) still.parentNode.removeChild(still);
      var video = document.createElement("video");
      video.setAttribute("playsinline", "");
      video.setAttribute("muted", "");
      video.muted = true;
      video.autoplay = true;
      video.style.transform = "translate(-50%,-50%)";
      video.srcObject = stream;
      vf.insertBefore(video, vf.firstChild);
      var p = video.play();
      if (p && typeof p.catch === "function") p.catch(function () { /* autoplay refused */ });
    })
    .catch(function () {
      // Permission denied, no device, or an insecure context that still
      // exposed the API. Either way: the file path, not a dead end.
      if (token !== cameraToken) return;
      State.capture.cameraAvailable = false;
      render();
    });
}
var cameraToken = 0;

// Live warnings cycle on the viewfinder so the warning component is visible
// in the demo without a real camera to misbehave.
var warnTimer = null;
function cycleWarnings() {
  if (warnTimer) clearInterval(warnTimer);
  warnTimer = setInterval(function () {
    if (State.screen !== "capture" || State.capture.shot) return;
    State.capture.warnIndex = (State.capture.warnIndex + 1) % WARNINGS.length;
    render();
  }, 3200);
}

/* -- full-photo overlay: pinch and double-tap zoom -------------------------- */
var pointers = {};
var pinchStart = null;
var lastTap = 0;

function onPointerDown(e) {
  var pane = document.getElementById("fullpane");
  if (!pane || !pane.contains(e.target)) return;
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(pointers);
  if (ids.length === 2) {
    pinchStart = {
      dist: pointerDistance(),
      level: zoom.level
    };
  } else if (ids.length === 1) {
    var now = Date.now();
    if (now - lastTap < 300) {
      zoom.level = zoom.level > 1.4 ? 1 : 2.2;
      zoom.x = 0; zoom.y = 0;
      layoutFullPane();
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }
}

function onPointerMove(e) {
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (pinchStart && Object.keys(pointers).length === 2) {
    var d = pointerDistance();
    if (pinchStart.dist > 0) {
      zoom.level = Math.max(1, Math.min(5, pinchStart.level * (d / pinchStart.dist)));
      layoutFullPane();
    }
  }
}

function onPointerUp(e) {
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinchStart = null;
}

function pointerDistance() {
  var ids = Object.keys(pointers);
  if (ids.length < 2) return 0;
  var a = pointers[ids[0]], b = pointers[ids[1]];
  return Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2));
}

/* ===========================================================================
   DEMO
   Hidden controls for demoing at a pharmacy counter: invisible by default,
   opened by a long-press on the wordmark or by ?demo=1 (also #demo). It has
   to be reliable and fast to reach, so it is a plain panel, not a gesture
   chord.
   =========================================================================== */

function demoPanel() {
  var s = State.session;
  var sampleSelect = el("select", { "data-act": "demo-sample", "aria-label": "sample" });
  SAMPLES.forEach(function (sm) {
    var o = el("option", { value: sm.id, text: "№" + sm.number });
    if (s && s.sampleId === sm.id) o.setAttribute("selected", "");
    sampleSelect.appendChild(o);
  });

  var stateSelect = el("select", { "data-act": "demo-state", "aria-label": "field state" });
  stateSelect.appendChild(el("option", { value: "", text: "— state —" }));
  [FIELD_STATE.AGREED, FIELD_STATE.DISAGREEMENT, FIELD_STATE.ILLEGIBLE, FIELD_STATE.ABSENT,
   FIELD_STATE.FLAG_NOT_IN_REGISTRY, FIELD_STATE.FLAG_LOOKALIKE].forEach(function (st) {
    stateSelect.appendChild(el("option", { value: st, text: st }));
  });

  var fieldSelect = el("select", { "data-act": "demo-field", "aria-label": "field" });
  if (s) s.fields.forEach(function (f) {
    var o = el("option", { value: f.id, text: labelFor(f.id) });
    if (s.focus === f.id) o.setAttribute("selected", "");
    fieldSelect.appendChild(o);
  });

  return el("div", { class: "demo", id: "demo" }, [
    el("div", { style: "display:flex;align-items:center;gap:8px" }, [
      el("h2", { text: t("demoTitle") }),
      el("div", { style: "flex:1" }),
      btn({ class: "iconbtn", "data-act": "demo-close", "aria-label": "close" },
          [el("span", { class: "mono", text: "✕" })])
    ]),
    el("div", { class: "grid" }, [
      el("label", { style: "display:flex;flex-direction:column;gap:4px" }, [
        el("span", { style: "font-size:16px", text: "Sample" }), sampleSelect
      ]),
      el("label", { style: "display:flex;flex-direction:column;gap:4px" }, [
        el("span", { style: "font-size:16px", text: "Field" }), fieldSelect
      ]),
      el("label", { style: "display:flex;flex-direction:column;gap:4px" }, [
        el("span", { style: "font-size:16px", text: "Force state" }), stateSelect
      ])
    ]),
    el("div", { class: "grid" }, [
      btn({ "data-act": "demo-replay-slow", text: "Replay · slow second reading" }),
      btn({ "data-act": "demo-fail", text: "Force second-reading failure" }),
      btn({ "data-act": "demo-land-all", text: "Land all readings now" }),
      btn({ "data-act": "demo-reset-archive", text: "Reset archive" }),
      btn({ "data-act": "demo-signout", text: "Sign out" })
    ]),
    el("div", { style: "font-size:16px", text:
      "AZ strings marked [X] in I18N are drafts, not from /design/. All AZ is pending native review." })
  ]);
}

function handleDemo(act, node) {
  switch (act) {
    case "demo-close":
      State.demoOpen = false; render(); return true;

    case "demo-sample": {
      State.capture.sampleId = node.value;
      beginSession(node.value);
      State.demoOpen = true;
      render();
      return true;
    }
    case "demo-field":
      if (State.session) focusField(node.value);
      State.demoOpen = true;
      render();
      return true;

    case "demo-state": {
      var s = State.session;
      if (!s || !node.value) return true;
      var f = fieldById(s, s.focus);
      if (!f) return true;
      // Landing the field is explicit here: the demo control cannot be used
      // to render a settled-capable state on an unlanded field, because
      // fieldState() would still return `awaiting`.
      f.landed = true;
      f.resolution = null;
      f.demoState = node.value;
      if (node.value === FIELD_STATE.FLAG_LOOKALIKE && !f.catalogue) {
        f.catalogue = SAMPLES[2].fields[1].catalogue;
      }
      if (node.value === FIELD_STATE.DISAGREEMENT && f.first === f.second) {
        f.second = f.first + " · 2";
      }
      s.landedCount = landedCount(s);
      persistSession();
      render();
      return true;
    }

    case "demo-replay-slow":
      State.capture.slowSecond = true;
      State.capture.failSecond = false;
      beginSession(State.session ? State.session.sampleId : SAMPLES[0].id);
      State.demoOpen = true;
      render();
      return true;

    case "demo-fail":
      State.capture.failSecond = true;
      State.capture.slowSecond = false;
      beginSession(State.session ? State.session.sampleId : SAMPLES[0].id);
      State.demoOpen = true;
      render();
      return true;

    case "demo-land-all": {
      var ss = State.session;
      if (!ss) return true;
      ss.fields.forEach(function (f) { f.landed = true; });
      ss.landedCount = landedCount(ss);
      ss.stalled = false;
      persistSession();
      render();
      return true;
    }

    case "demo-reset-archive":
      State.archive = seedArchive();
      persistArchive();
      render();
      return true;

    case "demo-signout":
      State.runToken++;
      stopReading();
      State.session = null;
      State.user = null;
      storeRemove(K_SESSION);
      storeRemove(K_USER);
      State.screen = "signin";
      render();
      return true;
  }
  return false;
}

function wireDemoLongPress() {
  var timer = null;
  function down(e) {
    var n = actOn(e.target);
    if (!n || n.getAttribute("data-act") !== "wordmark") return;
    timer = setTimeout(function () {
      State.demo = true;
      State.demoOpen = true;
      render();
    }, 600);
  }
  function up() { if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener("pointerdown", down);
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", up);
  document.addEventListener("pointerleave", up);
}

/* ===========================================================================
   BOOT
   =========================================================================== */

function boot() {
  restore();

  var q = "";
  try { q = String(window.location.search || "") + String(window.location.hash || ""); }
  catch (e) { q = ""; }
  if (q.indexOf("demo=1") >= 0 || q.indexOf("#demo") >= 0) {
    State.demo = true;
    State.demoOpen = true;
  }

  if (!State.user) State.screen = "signin";

  document.addEventListener("click", function (e) {
    var n = actOn(e.target);
    if (n) {
      var a = n.getAttribute("data-act");
      if (a && a.indexOf("demo-") === 0) { if (handleDemo(a, n)) return; }
    }
    handleClick(e);
  });

  document.addEventListener("change", function (e) {
    var n = e.target;
    var a = n.getAttribute && n.getAttribute("data-act");
    if (a && a.indexOf("demo-") === 0) { handleDemo(a, n); return; }
    if (a === "file") handleInput(e);
  });

  document.addEventListener("input", handleInput);
  document.addEventListener("keydown", handleKeydown);
  document.addEventListener("pointerdown", onPointerDown);
  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerUp);
  document.addEventListener("pointercancel", onPointerUp);

  window.addEventListener("resize", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".crop"), applyCrop);
    layoutFullPane();
  });

  window.addEventListener("orientationchange", function () {
    setTimeout(function () {
      Array.prototype.forEach.call(document.querySelectorAll(".crop"), applyCrop);
      layoutFullPane();
    }, 80);
  });

  wireDemoLongPress();
  cycleWarnings();
  render();

  if (State.session && State.screen === "verify") startSecondReading();

  // Test and demo surface. The invariants are enforced inside these
  // functions, so calling them from the console is a legitimate way to prove
  // that they hold — which is exactly what tests/adversarial.spec.js does.
  window.Siruply = {
    state: State,
    FIELD_STATE: FIELD_STATE,
    SOURCE: SOURCE,
    complete: completeSession,
    resolve: resolveField,
    reopen: reopenField,
    fieldState: function (id) { return fieldState(fieldById(State.session, id)); },
    openFields: function () { return openFields(State.session).map(function (f) { return f.id; }); },
    archiveFor: archiveFor,
    optionsFor: function (id) { return optionsFor(fieldById(State.session, id)); },
    begin: beginSession,
    landAll: function () {
      if (!State.session) return;
      State.session.fields.forEach(function (f) { f.landed = true; });
      State.session.landedCount = landedCount(State.session);
      render();
    },
    render: render
  };
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
